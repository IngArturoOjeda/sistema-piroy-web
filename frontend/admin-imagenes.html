<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgroVetzo - Panel de Imágenes</title>
  <link rel="icon" type="image/png" href="/frontend/assets/images/favicon.png">
  <link rel="stylesheet" href="/frontend/css/admin-imagenes.css">
</head>
<body>
  <header class="admin-header">
    <img src="/frontend/assets/images/logo-vete.jpg" alt="AgroVetzo" class="admin-logo">
    <h1>Panel de Imágenes</h1>
    <nav class="admin-nav">
      <a href="/frontend/admin-banners.html">Banners del carrusel</a>
      <a href="/frontend/admin-tipos.html">Tipos de artículos</a>
      <a href="/frontend/admin-usuarios.html">Usuarios</a>
    </nav>
    <div class="admin-sesion">
      <span id="admin-usuario" class="admin-usuario"></span>
      <button type="button" id="btn-salir" class="btn-salir">Cerrar sesión</button>
    </div>
  </header>

  <main class="admin-contenido">
    <aside class="admin-resultados">
      <div class="buscador-lateral">
        <label class="filtro-tipo" for="filtro-tipo">
          <span>Tipo de artículo</span>
          <select id="filtro-tipo">
            <option value="">Todos</option>
          </select>
        </label>
        <div class="caja-buscar-wrapper">
          <input type="text" id="txt-buscar-admin" placeholder="Buscar por código o nombre...">
          <span class="icono-lupa">🔍</span>
        </div>
        <p id="estado-lista" class="estado-lista" role="status"></p>
      </div>

      <ul id="lista-resultados" class="lista-resultados-scroll"></ul>
    </aside>

    <section class="admin-detalle" id="panel-detalle">
      <p class="admin-detalle-vacio">Elegí un artículo de la lista para ver su imagen.</p>
    </section>
  </main>

  <script src="/frontend/js/admin-sesion.js"></script>
  <script src="/frontend/js/admin-imagenes.js"></script>
</body>
</html>
