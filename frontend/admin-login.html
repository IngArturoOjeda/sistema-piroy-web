<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>AGRO-VETZO - Ingreso al panel</title>
  <link rel="icon" type="image/png" href="/frontend/assets/images/favicon.png">
  <link rel="manifest" href="/admin/manifest.webmanifest">
  <meta name="theme-color" content="#603000">
  <meta name="apple-mobile-web-app-title" content="AGRO-VETZO">
  <link rel="apple-touch-icon" href="/frontend/assets/images/admin/icono-192.png">
  <link rel="stylesheet" href="/frontend/css/admin-imagenes.css">
</head>
<body>
  <header class="admin-header">
    <img src="/frontend/assets/images/logo-vete.jpg" alt="AGRO-VETZO" class="admin-logo">
    <h1>Panel de administración</h1>
    <button type="button" id="btn-instalar" class="btn-salir btn-instalar-ingreso" hidden>Instalar app</button>
  </header>

  <main class="login-contenido">
    <form id="form-login" class="login-tarjeta" autocomplete="on">
      <h2>Ingresá con tu usuario</h2>
      <label class="login-campo">
        <span>Usuario</span>
        <input type="text" id="login-usuario" name="username" autocomplete="username"
               autocapitalize="none" spellcheck="false" maxlength="50" required autofocus>
      </label>
      <label class="login-campo">
        <span>Contraseña</span>
        <span class="campo-clave">
          <input type="password" id="login-password" name="password" autocomplete="current-password"
                 maxlength="200" required>
          <button type="button" class="btn-ojo" data-ojo-para="login-password"
                  aria-label="Mostrar contraseña" aria-pressed="false">
            <svg class="ojo-abierto" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="ojo-tachado" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C5 20 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </span>
      </label>
      <button type="submit" id="btn-ingresar" class="btn-ingresar">Ingresar</button>
      <p id="login-error" class="login-error" role="alert" hidden></p>
    </form>
  </main>

  <script src="/frontend/js/admin-pwa.js"></script>
  <script src="/frontend/js/admin-ojo.js"></script>
  <script src="/frontend/js/admin-login.js"></script>
</body>
</html>
